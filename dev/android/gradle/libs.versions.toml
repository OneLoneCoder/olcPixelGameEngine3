[versions]
agp = "9.0.0"
coreKtx = "1.10.1"
gamesActivity = "4.0.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
startupRuntime = "1.2.0"
kotlin = "2.2.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
